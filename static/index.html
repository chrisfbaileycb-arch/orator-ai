<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE ORATOR — Autonomous Software Forge // Signal F</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cinematic Scanlines & Grain Layer -->
  <div class="terminal-scanlines"></div>
  <div class="terminal-grain"></div>

  <!-- Ambient Atmospheric Volumetric Glow Layer -->
  <div class="ambient-glow-bg"></div>

  <!-- Velvet Rope Intermittent Scarcity Toast Alert -->
  <div id="velvet-toast-container" class="velvet-toast-container"></div>

  <!-- Main App Shell -->
  <div class="centered-app-container">

    <!-- Top Header Bar (Velvet Rope Telemetry) -->
    <header class="top-deck-header">
      <div class="brand-left">
        <span class="brand-dot"></span>
        <span class="brand-title">THE ORATOR</span>
        <span class="brand-tag">AUTONOMOUS FORGE</span>
      </div>
      <div class="header-meta">
        <div class="forge-capacity-pill">FORGE CAPACITY: <strong style="color:var(--gold-bright)" id="telemetry-capacity">92%</strong> | ACTIVE BUILDS: <strong style="color:var(--cyan-stream)" id="telemetry-builds">8/10</strong></div>
        <div class="free-tier-tracker">PRIVILEGE STATUS: <strong style="color:var(--gold-bright)" id="free-tier-count">3 FORGES AUTHORIZED</strong></div>
        <button id="sound-toggle-btn" class="sound-btn active">AUDIO: ON 🔊</button>
      </div>
    </header>

    <!-- Core Workspace Card -->
    <main class="centered-workspace-card">

      <!-- ORB HERO SECTION — 3D WebGL Pearlescent Plasma & 15-Segment Orbital Halo -->
      <section class="massive-orb-viewport" id="massive-orb-viewport">
        <!-- Status indicator above orb -->
        <div class="orb-status-line" id="orb-status-line">✦ THE ORATOR IS LISTENING — STATE YOUR ARCHITECTURE</div>

        <!-- 3D Three.js Container + 15-Segment Orbital Halo Overlay -->
        <div class="orb-interactive-stage">
          <div id="mystic-sphere-container"></div>
          
          <!-- 15-Question Segmented Orbital Progress Halo -->
          <svg class="orbital-halo-svg" id="orbital-halo-svg" viewBox="0 0 440 440">
            <defs>
              <linearGradient id="halo-ignited-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f0ff" />
                <stop offset="50%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#ffd700" />
              </linearGradient>
            </defs>
            <g id="halo-segments-group"></g>
          </svg>
          <div class="halo-counter-badge" id="halo-counter-badge">INQUEST: 0/15 RESOLVED</div>
        </div>

        <!-- Identity overlay at bottom -->
        <div class="orb-overlay-title">
          <div class="mystic-header-text">IMMUTABLE ARCHITECTURAL SANCTUM</div>
          <div class="mystic-sub-text">16+ MODEL MIXTURE-OF-EXPERTS • ZERO-DISK RUNTIME • VELVET ROPE GATED SLOTS</div>
        </div>
      </section>

      <!-- Conversational Message Stream (The Inquest & Blueprint Lock) -->
      <section class="chat-stream-pane" id="chat-messages-container"></section>

      <!-- Chat Input Bar -->
      <div class="chat-input-wrapper" id="chat-input-wrapper">
        <div class="chat-input-box">
          <input type="file" id="chat-file-input" accept=".md,.png,.jpg,.jpeg,.webp" multiple style="display:none;" />
          <button id="chat-attach-btn" class="chat-icon-btn" title="Attach Specification (.md) or Visual Architecture">📎</button>
          <button id="chat-mic-btn" class="chat-icon-btn" title="Voice Input">🎤</button>
          <textarea
            id="chat-prompt-input"
            class="chat-textarea"
            rows="1"
            placeholder="Command the Orator — state the product or system you want to construct..."
          ></textarea>
          <button id="chat-send-btn" class="chat-send-btn" title="Forge (Enter)">➔</button>
        </div>
      </div>

    </main><!-- end .centered-workspace-card -->

    <!-- Phase IV: The Forge Deck — revealed upon slot authorization -->
    <div id="agent-execution-container" style="display:none;"></div>

  </div><!-- end .centered-app-container -->

  <!-- === SCRIPTS === -->
  <!-- Three.js 3D WebGL Engine -->
  <script src="vendor/three.min.js"></script>
  <!-- Audio Engine with AnalyserNode + 30Hz Ambient Drone -->
  <script src="js/audio-synth.js"></script>
  <!-- 3D Iridescent Pearlescent Plasma Core + Dynamic GLSL Shaders -->
  <script src="js/three-core.js"></script>
  <!-- Dynamic Real-Time Mind Map Graph -->
  <script src="js/mind-map.js"></script>
  <!-- Full Manufacturing Deck / The Forge -->
  <script src="js/agent-orchestrator.js"></script>
  <!-- Conversational Inquest & Velvet Rope Slot Engine -->
  <script src="js/chat-core.js"></script>
  <!-- Main Bootstrap Application -->
  <script src="js/app.js"></script>

</body>
</html>
